parameters:
  atoolo_genai.connection.scheme.default: 'http'
  atoolo_genai.connection.host.default: 'localhost'
  atoolo_genai.connection.port.default: '8080'
  atoolo_genai.connection.path.default: ''
  atoolo_genai.connection.api_key.default: ''
  # the application answers a bulk only once it has embedded every document
  atoolo_genai.connection.idle_timeout.default: 300
  atoolo_genai.connection.scheme: '%env(default:atoolo_genai.connection.scheme.default:GENAI_SCHEME)%'
  atoolo_genai.connection.host: '%env(default:atoolo_genai.connection.host.default:GENAI_HOST)%'
  atoolo_genai.connection.port: '%env(default:atoolo_genai.connection.port.default:GENAI_PORT)%'
  atoolo_genai.connection.path: '%env(default:atoolo_genai.connection.path.default:GENAI_PATH)%'
  atoolo_genai.connection.url: '%atoolo_genai.connection.scheme%://%atoolo_genai.connection.host%:%atoolo_genai.connection.port%%atoolo_genai.connection.path%'
  atoolo_genai.connection.api_key: '%env(default:atoolo_genai.connection.api_key.default:GENAI_API_KEY)%'
  atoolo_genai.connection.idle_timeout: '%env(default:atoolo_genai.connection.idle_timeout.default:GENAI_IDLE_TIMEOUT)%'
  # pauses in seconds between the attempts of an index request the
  # application refuses with 409 because another run writes the source,
  # comma separated; empty disables the retry
  atoolo_genai.connection.busy_retries.default: '15,30,60'
  atoolo_genai.connection.busy_retries: '%env(csv:default:atoolo_genai.connection.busy_retries.default:GENAI_BUSY_RETRIES)%'
  # the object types whose date is relevant, comma separated; the other
  # documents are sent without a date, so that their age does not matter
  atoolo_genai.indexer.dated_object_types.default: 'news'
  atoolo_genai.indexer.dated_object_types: '%env(csv:default:atoolo_genai.indexer.dated_object_types.default:GENAI_DATED_OBJECT_TYPES)%'

services:

  _defaults:
    autowire: true
    autoconfigure: true

  Atoolo\GenAi\Service\EnvVarLoader:
    tags:
      - { name: 'container.env_var_loader' }

  atoolo_genai.http_client:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
    arguments:
      # symfony's timeout is the idle timeout, not the total duration
      - { timeout: '%atoolo_genai.connection.idle_timeout%' }

  atoolo_genai.client:
    class: Atoolo\GenAi\Service\GenAiHttpClient
    arguments:
      - '@atoolo_genai.http_client'
      - '%atoolo_genai.connection.url%'
      - '%atoolo_genai.connection.api_key%'
      - '@?request_stack'
      - '%atoolo_genai.connection.busy_retries%'

  atoolo_genai.assistant:
    class: Atoolo\GenAi\Service\Assistant\HttpAssistant
    arguments:
      - '@atoolo_genai.client'
      - '@atoolo_resource.resource_channel'

  Atoolo\GenAi\Assistant:
    alias: atoolo_genai.assistant

  Atoolo\GenAi\GraphQL\Assistant:
    public: true
    arguments:
      - '@atoolo_genai.assistant'
