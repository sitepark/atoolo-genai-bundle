overblog_graphql:
  definitions:
    schema:
      query: RootQuery
      mutation: RootMutation
      # implementations of GenAiAnswerSection that no field names; without
      # them here they would be missing from the schema
      types: [GenAiTextSection, GenAiLinksSection]
    mappings:
      types:
        - type: attribute
          dir: "%atoolo_genai.src_dir%/GraphQL"
          suffix: ~
        - types: [yaml]
          dir: "%atoolo_genai.config_dir%/graphql/types"
          suffix: ~
