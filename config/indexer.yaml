services:

  _defaults:
    autowire: true
    autoconfigure: true

  atoolo_genai.indexer.document_factory:
    class: Atoolo\GenAi\Service\Indexer\GenAiDocumentFactory
    arguments:
      - '@atoolo_resource.resource_channel'

  atoolo_genai.indexer.index_service:
    class: Atoolo\GenAi\Service\Indexer\HttpIndexService
    arguments:
      - '@atoolo_genai.client'
      - '@atoolo_resource.resource_channel'
      - '@atoolo_genai.indexer.document_factory'

  Atoolo\GenAi\Service\Indexer\SiteKit\DefaultGenAiDocumentEnricher:
    arguments:
      - '@atoolo_resource.navigation_hierarchy_loader'
      - '@atoolo_resource.resource_channel'
      - 'internal'
    tags:
      - { name: 'atoolo_genai.indexer.document_enricher', priority: 100 }

  atoolo_genai.indexer.resource_filter:
    class: Atoolo\GenAi\Service\Indexer\ChannelLanguageFilter
    arguments:
      - '@atoolo_index.indexer.resource_filter'
      - '@atoolo_resource.resource_channel'

  atoolo_genai.indexer.progress_state:
    class: Atoolo\Index\Service\Indexer\IndexerProgressState
    arguments:
      - '@atoolo_index.index_name'
      - '@atoolo_index.indexer.status_store'
      # the id of the indexer, which keys its status
      - 'genai'

  atoolo_genai.indexer.internal_resource_indexer:
    class: Atoolo\Index\Service\Indexer\InternalResourceIndexer
    arguments:
      $documentEnricherList: !tagged_iterator atoolo_genai.indexer.document_enricher
      $resourceFilter: '@atoolo_genai.indexer.resource_filter'
      $progressHandler: '@atoolo_genai.indexer.progress_state'
      $finder: '@atoolo_index.indexer.location_finder'
      $resourceLoader: '@atoolo_resource.resource_loader'
      $indexService: '@atoolo_genai.indexer.index_service'
      $aborter: '@atoolo_index.indexer.aborter'
      $configLoader: '@atoolo_index.indexer.configuration_loader'
      # the same resources the solr indexer reads
      $source: 'internal'
      $indexName: '@atoolo_index.index_name'
      # only offered once the CMS provides configs/indexer/genai.php
      $enabledWithoutConfig: false
      $limitIncreaser: '@atoolo_index.indexer.php_limit_increaser'
      $logger: '@logger'
      $id: 'genai'
    tags:
      - { name: 'atoolo_index.indexer', priority: 10 }

  atoolo_genai.indexer.index_document_dumper:
    class: Atoolo\Index\Service\Indexer\IndexDocumentDumper
    arguments:
      - '@atoolo_resource.resource_loader'
      - !tagged_iterator { tag: 'atoolo_genai.indexer.document_enricher' }
      - '@atoolo_genai.indexer.document_factory'
      - 'internal'
      - 'genai'
    tags:
      - { name: 'atoolo_index.indexer.document_dumper' }
