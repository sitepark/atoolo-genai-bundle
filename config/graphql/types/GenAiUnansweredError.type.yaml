GenAiUnansweredError:
  type: object
  config:
    description: "An error of the GenAI application this version of the bundle does not know yet. The question was not answered."
    interfaces: [GenAiAnsweredQuestion]
    fields:
      id:
        type: ID
        description: "Id of the stored error; null if it was not stored."
      feedbackToken:
        type: String
        description: "Token to give feedback on the error with genAiAnswerFeedback, valid for 15 minutes by default; null if it cannot be rated."
      duration:
        type: Float!
        description: "Runtime of the request in seconds."
