GenAiLinksSection:
  type: object
  config:
    description: "A list of links of an answer, each with a label."
    interfaces: [GenAiAnswerSection]
    fields:
      headline: { type: "String!" }
      links: { type: "[GenAiAnswerLink!]!" }
      sources:
        type: "[GenAiAnswerSource!]!"
        description: "The resources the content comes from, empty if it comes from none in particular."
