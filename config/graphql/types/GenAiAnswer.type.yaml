GenAiAnswer:
  type: object
  config:
    description: "The answer of the GenAI application to a question."
    interfaces: [GenAiAnsweredQuestion]
    fields:
      id:
        type: ID
        description: "Id of the answer; null if it was not stored."
      feedbackToken:
        type: String
        description: "Token to give feedback on the answer with genAiAnswerFeedback, valid for 15 minutes by default; null if the answer cannot be rated."
      sections:
        type: "[GenAiAnswerSection!]!"
        description: "The parts of the answer."
      duration:
        type: Float!
        description: "Runtime of the request in seconds."
